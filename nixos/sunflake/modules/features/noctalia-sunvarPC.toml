[accessibility]
ui_scale = 1.5000000149011612

[bar.default]
background_opacity = 0.59999998658895493
center = [ "media" ]
end = [ "clock", "tray", "notifications", "clipboard", "session", "cpu", "ram", "temp" ]
start = [ "control-center", "launcher", "wallpaper" ]

[dock]
active_monitor_only = true
auto_hide = true
background_opacity = 1.0
enabled = true
reserve_space = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1920.0
    cy = 2041.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1920.0
    cy = 2041.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0

[shell]
font_family = "DejaVu Sans"

    [shell.panel]
    transparency_mode = "glass"

[theme]
custom_palette = "stylix"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/sunvar/workbench/wallpapers/Space"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/sunvar/workbench/wallpapers/Space/wallhaven-gjj5vq.jpg"

    [wallpaper.last]
    path = "/home/sunvar/workbench/wallpapers/Space/wallhaven-gjj5vq.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/sunvar/workbench/wallpapers/Space/wallhaven-gjj5vq.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/sunvar/workbench/wallpapers/Space/wallhaven-gjj5vq.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/sunvar/workbench/wallpapers/Space/wallhaven-gjj5vq.jpg"

    [[wallpaper.favorite]]
    path = "/home/sunvar/workbench/wallpapers/Space/wallhaven-z8rljj.jpg"
    theme_mode = "auto"
